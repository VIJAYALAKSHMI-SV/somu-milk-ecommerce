spring.application.name=somu-milk-backend
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/somu_milk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
