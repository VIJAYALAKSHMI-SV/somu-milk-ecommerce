services:
  mysql:
    image: mysql:8.4
    container_name: somu-milk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: somu_milk
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-somu_dev_password_change_me}
    ports:
      - "3306:3306"
    volumes:
      - somu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-somu_dev_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  somu_mysql_data:
